{% extends 'base.html' %}
{% block title %}Editar sanción{% endblock %}
{% block content %}
<style>
.module-page section{background:white;padding:22px;border-radius:13px;border:1px solid #d9e1e8;margin:18px 0;overflow-x:auto}
.module-page input,.module-page select{padding:9px;border:1px solid #bbc8d0;border-radius:7px;max-width:100%;font:inherit}
.module-page button{background:#155f58;color:white;border:0;padding:9px 12px;border-radius:7px;cursor:pointer;font:inherit}
.module-page button.danger{background:#a63f3f}
.module-page .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.module-page .grid label{display:grid;gap:5px}
.module-page form.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px}
.module-page table{min-width:650px}
.module-page th,.module-page td{padding:11px;text-align:left}
.module-page form.inline{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.module-page small,.module-page .nota{color:#68788a}
.module-page .acciones{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.module-page .acciones form{margin:0}
.module-page .mod-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.module-page label{display:block;font-size:14px;font-weight:650;margin-bottom:5px}
.module-page input,.module-page select{width:100%}
.module-page .grid input,.module-page .grid select{width:100%}
</style>
<div class="module-page">
<div class="mod-header"><h1>Editar sanción disciplinaria #{{sancion.id_sancion}}</h1>
<a href="{{url_for('sanciones_disciplinarias.lista')}}">Volver</a></div>

<section><form method="post" class="campos"><input type="hidden" name="_csrf" value="{{csrf}}">
<div><label>Edición</label><select name="id_torneo">
{% for t in torneos %}<option value="{{t.id_torneo}}" {{'selected' if t.id_torneo==sancion.id_torneo else ''}}>{{t.nombre}} ({{t.anio}} S{{t.semestre}})</option>{% endfor %}
</select></div>
<div><label>Jugador</label><select name="ci_jugador">
{% for j in jugadores %}<option value="{{j.ci}}" {{'selected' if j.ci==sancion.ci_jugador and j.id_torneo==sancion.id_torneo else ''}}>{{j.nombre}} {{j.apellido}} · {{j.ci}} · {{j.equipo}} (edición {{j.id_torneo}})</option>{% endfor %}
</select></div>
<div><label>Fecha desde</label><input type="number" min="1" name="numero_fecha_inicio" value="{{sancion.numero_fecha_inicio}}" required></div>
<div><label>Cantidad de fechas</label><input type="number" min="1" max="30" name="cantidad_fechas" value="{{sancion.cantidad_fechas}}" required></div>
<div style="align-self:end"><button type="submit">Guardar cambios</button></div>
</form></section>
</div>
{% endblock %}
