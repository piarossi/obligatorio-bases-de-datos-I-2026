<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titulo }}</title><style>body{font-family:system-ui;max-width:650px;margin:40px auto;padding:0 20px;background:#f7f8fb;color:#222}label{display:block;margin:16px 0 4px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:5px}button{margin-top:18px;padding:10px 20px;cursor:pointer}.msg{padding:12px;background:#ffe4dc;border-radius:6px}</style></head><body><p><a href="{{ url_for('jugadores.lista') }}">← Jugadores</a></p><h1>{{ titulo }}</h1>{% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
<form method="post">
<label for="ci">Cédula de identidad</label><input id="ci" name="ci" value="{{ jugador.ci if jugador else '' }}" required maxlength="20" {% if not nuevo %}readonly{% endif %}>
<label for="nombre">Nombre</label><input id="nombre" name="nombre" value="{{ jugador.nombre if jugador else '' }}" required maxlength="80">
<label for="apellido">Apellido</label><input id="apellido" name="apellido" value="{{ jugador.apellido if jugador else '' }}" required maxlength="80">
<label for="email">Correo</label><input id="email" type="email" name="email" value="{{ jugador.email if jugador else '' }}" required maxlength="150">
<label for="fecha_nacimiento">Fecha de nacimiento</label><input id="fecha_nacimiento" type="date" name="fecha_nacimiento" value="{{ jugador.fecha_nacimiento if jugador else '' }}" required>
<label for="id_facultad">Facultad</label><select id="id_facultad" name="id_facultad" required><option value="">Seleccionar</option>{% for f in facultades %}<option value="{{ f.id_facultad }}" {% if jugador and (jugador.id_facultad|string)==(f.id_facultad|string) %}selected{% endif %}>{{ f.nombre }}</option>{% endfor %}</select>
<label for="tipo">Tipo</label><select id="tipo" name="tipo" required>{% for t in ['grado','posgrado','docente','funcionario'] %}<option value="{{ t }}" {% if jugador and jugador.tipo==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
<button type="submit">Guardar</button>
</form><p><small>La CI no se modifica una vez creada. La baja se hace desde el listado y conserva el historial.</small></p></body></html>
