{% extends 'base.html' %}{% block title %}{{ titulo }}{% endblock %}{% block content %}
<a class="back" href="{{ url_for('jugadores.lista') }}">← Volver a jugadores</a>
<div class="heading"><div><p class="eyebrow">Administración</p><h1>{{ titulo }}</h1><p class="sub">Completá los datos del jugador.</p></div></div>
<section class="card card-pad"><form method="post"><div class="form-grid">
<div class="field"><label for="ci">Cédula de identidad</label><input id="ci" name="ci" value="{{ jugador.ci if jugador else '' }}" required maxlength="20" {% if not nuevo %}readonly{% endif %}></div>
<div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre" value="{{ jugador.nombre if jugador else '' }}" required maxlength="80"></div>
<div class="field"><label for="apellido">Apellido</label><input id="apellido" name="apellido" value="{{ jugador.apellido if jugador else '' }}" required maxlength="80"></div>
<div class="field"><label for="email">Correo</label><input id="email" type="email" name="email" value="{{ jugador.email if jugador else '' }}" required maxlength="150"></div>
<div class="field"><label for="fecha_nacimiento">Fecha de nacimiento</label><input id="fecha_nacimiento" type="date" name="fecha_nacimiento" value="{{ jugador.fecha_nacimiento if jugador else '' }}" required></div>
<div class="field"><label for="id_facultad">Facultad</label><select id="id_facultad" name="id_facultad" required><option value="">Seleccionar</option>{% for f in facultades %}<option value="{{ f.id_facultad }}" {% if jugador and (jugador.id_facultad|string)==(f.id_facultad|string) %}selected{% endif %}>{{ f.nombre }}</option>{% endfor %}</select></div>
<div class="field"><label for="tipo">Tipo</label><select id="tipo" name="tipo" required>{% for t in ['grado','posgrado','docente','funcionario'] %}<option value="{{ t }}" {% if jugador and jugador.tipo==t %}selected{% endif %}>{{ t|capitalize }}</option>{% endfor %}</select></div>
</div><div class="actions" style="margin-top:26px"><button class="btn" type="submit">Guardar jugador</button><a class="btn secondary" href="{{ url_for('jugadores.lista') }}">Cancelar</a></div></form><p class="muted-note">La CI no se modifica. La baja lógica conserva el historial.</p></section>
{% endblock %}
