<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar · Torneo Interfacultades</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
<style>
*{box-sizing:border-box}.login-pagina{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6fb;font-family:inherit}
.login-contenedor{width:min(100%,420px)}.login-marca{text-align:center;margin-bottom:24px;color:#19253c}
.login-marca .logo{font-size:36px;display:block;margin-bottom:10px}.login-marca h1{font-size:23px;margin:0 0 6px}.login-marca p{color:#627189;margin:0}
.login-tarjeta{background:white;border:1px solid #dce4ee;border-radius:18px;padding:32px;box-shadow:0 8px 22px #18243b0a}
.login-tarjeta h2{color:#19253c;margin:0 0 8px;font-size:27px}.login-tarjeta p{color:#627189;margin:0 0 22px}
.login-tarjeta label{display:block;font-weight:600;color:#26344c;margin:18px 0 7px}
.login-tarjeta input{width:100%;padding:12px;border:1px solid #ccd6e3;border-radius:8px;font:inherit}
.login-tarjeta button{margin-top:24px;width:100%;background:#115b57;color:white;padding:13px;border:0;border-radius:8px;font:inherit;font-weight:bold;cursor:pointer}
.login-consulta{display:block;text-align:center;margin-top:20px;color:#115b57;text-decoration:none;font-weight:600}
.login-error{color:#a52a2a!important;background:#fff1f0;padding:10px;border-radius:8px}
</style></head><body>
<main class="login-pagina"><div class="login-contenedor">
<header class="login-marca"><span class="logo">⚽</span><h1>Torneo Interfacultades</h1><p>UCU · Fútbol 5</p></header>
<section class="login-tarjeta"><h2>Bienvenido</h2><p>Iniciá sesión para gestionar el torneo.</p>
{% for mensaje in get_flashed_messages() %}<p class="login-error" role="alert">{{ mensaje }}</p>{% endfor %}
<form method="POST"><input type="hidden" name="_csrf" value="{{ csrf_general() }}">
<label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" autocomplete="username" required>
<label for="contrasena">Contraseña</label><input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
<button type="submit">Iniciar sesión</button>
</form><a class="login-consulta" href="{{ url_for('listar_equipos') }}">Consultar el torneo sin iniciar sesión</a>
</section></div></main></body></html>
